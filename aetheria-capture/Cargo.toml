[package]
name = "spinoff-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform audio capture for spinoff (CoreAudio / PipeWire)"

# No external dependencies — we use raw FFI for CoreAudio (macOS)
# and subprocess capture for PipeWire/PulseAudio (Linux).
# This makes the crate fully cross-platform with zero native dep issues.

[features]
default = []

[dependencies]
# None — all platform-specific code uses raw FFI or subprocess capture.
# coreaudio-sys was removed because we define our own FFI bindings.
# pipewire-rs was removed because we use pw-cat subprocess.
